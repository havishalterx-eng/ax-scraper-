[project]
name = "browser-mcp"
version = "0.1.0"
description = "MCP server giving AI agents real browser control (Playwright, indexed click/type interface)"
readme = "README.md"
authors = [
    { name = "havishaivardhan", email = "havishaivardhan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.79",
    "mcp>=2.1.1",
    "patchright>=1.62.1",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
browser-mcp = "browser_mcp.server:main"
browser-mcp-api = "browser_mcp.api:main"

[dependency-groups]
test = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
