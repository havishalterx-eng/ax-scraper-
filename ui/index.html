<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX Scraper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root { --accent: #FF4D0A; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: #ff7a42; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
  ::-webkit-scrollbar-track { background: transparent; }
  input::placeholder { color: rgba(255,255,255,0.35); }
  button { font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  #app { display:flex; flex-direction:column; width:100%; height:100vh; background:#050505; color:#f5f4f1; font-family:'Hanken Grotesk',-apple-system,'system-ui','Segoe UI',sans-serif; overflow:hidden; }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid rgba(255,255,255,0.12); flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:12px; }
  .mark { display:flex; align-items:center; justify-content:center; width:30px; height:30px; background:var(--accent); }
  .wordmark { display:flex; align-items:baseline; gap:8px; }
  .wordmark .name { font-size:18px; font-weight:700; letter-spacing:-0.5px; }
  .wordmark .sub { font-size:12px; color:rgba(255,255,255,0.4); font-weight:500; }
  .topbar-right { display:flex; align-items:center; gap:16px; }
  .status-dot-row { display:flex; align-items:center; gap:7px; font-size:12.5px; color:rgba(255,255,255,0.55); }
  .status-dot { width:7px; height:7px; display:inline-block; }
  .status-dot.up { background:#3ddc84; }
  .status-dot.down { background:#ff5c5c; }
  .btn-ghost { display:flex; align-items:center; gap:7px; background:transparent; border:1px solid rgba(255,255,255,0.18); color:#f5f4f1; font-size:13px; font-weight:600; padding:8px 14px; }

  .body { display:flex; flex-direction:row; flex-grow:1; min-height:0; }

  .sidebar { display:flex; flex-direction:column; width:288px; flex-shrink:0; border-right:1px solid rgba(255,255,255,0.12); padding:18px 0; }
  .sidebar-head { display:flex; align-items:center; justify-content:space-between; padding:0 18px 12px; }
  .sidebar-label { font-size:11px; font-weight:700; letter-spacing:1.2px; color:rgba(255,255,255,0.45); text-transform:uppercase; }
  .sidebar-count { font-size:11px; color:rgba(255,255,255,0.35); }
  .session-list { display:flex; flex-direction:column; gap:2px; padding:0 10px; overflow-y:auto; flex-grow:1; }
  .session-empty { padding:18px 10px; font-size:12.5px; color:rgba(255,255,255,0.4); line-height:1.6; }
  .session-card { display:flex; flex-direction:column; gap:6px; padding:12px 10px; cursor:pointer; border:1px solid rgba(255,255,255,0.1); background:transparent; }
  .session-card.selected { border-color:var(--accent); background:rgba(255,77,10,0.08); }
  .session-row { display:flex; align-items:center; justify-content:space-between; }
  .session-name-group { display:flex; align-items:center; gap:8px; min-width:0; }
  .dot { width:6px; height:6px; flex-shrink:0; }
  .session-name { font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-status { font-size:10px; font-weight:600; letter-spacing:0.3px; text-transform:uppercase; flex-shrink:0; }
  .session-url { font-size:11.5px; color:rgba(255,255,255,0.45); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:14px; }
  .new-session-wrap { padding:12px 18px 0; }
  .btn-new { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:transparent; border:1px solid var(--accent); color:var(--accent); font-size:13px; font-weight:700; padding:11px; }

  .main { display:flex; flex-direction:column; flex-grow:1; min-width:0; }
  .no-session-main { display:flex; align-items:center; justify-content:center; flex-grow:1; color:rgba(255,255,255,0.4); font-size:14px; }
  .session-header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px 0; }
  .session-header .title { font-size:16px; font-weight:700; }
  .session-header .url { font-size:12.5px; color:rgba(255,255,255,0.45); font-family:'SF Mono',Consolas,monospace; }
  .needs-you { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.3px; }
  .needs-you .dot { width:6px; height:6px; background:var(--accent); }

  .tabs { display:flex; gap:4px; padding:16px 24px 0; border-bottom:1px solid rgba(255,255,255,0.12); }
  .tab { padding:0 4px 12px; margin-bottom:-1px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,0.4); border-bottom:2px solid transparent; cursor:pointer; }
  .tab.active { color:#f5f4f1; border-bottom-color:var(--accent); }

  .tab-content { flex-grow:1; overflow-y:auto; padding:20px 24px; }
  .log-row { display:flex; gap:12px; align-items:baseline; font-size:12.5px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
  .log-time { color:rgba(255,255,255,0.35); font-family:'SF Mono',Consolas,monospace; flex-shrink:0; width:64px; }
  .log-tool { font-family:'SF Mono',Consolas,monospace; color:var(--accent); flex-shrink:0; }
  .log-detail { color:rgba(255,255,255,0.6); font-family:'SF Mono',Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty-note { font-size:12.5px; color:rgba(255,255,255,0.35); padding:8px 0; }

  .net-head { display:flex; gap:12px; padding:8px 0; font-size:10.5px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:rgba(255,255,255,0.4); }
  .net-note { margin-top:14px; font-size:12px; color:rgba(255,255,255,0.4); font-family:'SF Mono',Consolas,monospace; }

  .state-dump { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); padding:16px; font-family:'SF Mono',Consolas,monospace; font-size:12.5px; line-height:1.7; color:rgba(255,255,255,0.75); white-space:pre-wrap; }

  .approval-banner { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:#0d0d0d; border-top:1px solid var(--accent); flex-shrink:0; }
  .approval-label { font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.4px; }
  .approval-reason { font-size:13px; color:rgba(255,255,255,0.75); }
  .btn-approve { background:var(--accent); border:1px solid var(--accent); color:#050505; font-size:12.5px; font-weight:700; padding:9px 16px; }

  .task-row { display:flex; gap:10px; padding:16px 24px; border-top:1px solid rgba(255,255,255,0.12); flex-shrink:0; }
  .task-input { flex-grow:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); color:#f5f4f1; font-family:inherit; font-size:13.5px; padding:12px 14px; }
  .btn-send { background:var(--accent); border:1px solid var(--accent); color:#050505; font-size:13.5px; font-weight:700; padding:0 22px; }

  svg { display:block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API_BASE = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
  ? "http://localhost:8787"
  : "http://localhost:8787"; // same backend regardless of where the dashboard is served from

const state = {
  apiUp: null,
  sessions: [],       // [{name, url}]
  selectedId: null,
  activeTab: "activity",
  taskInput: "",
  logs: {},            // sessionId -> [{time, tool, detail}]
  jobs: {},            // sessionId -> {jobId, status, human_reason, pollTimer}
  networkText: null,
  stateText: null,
};

function activeDef() {
  return state.sessions.find((s) => s.name === state.selectedId) ?? null;
}

function pushLog(id, tool, detail) {
  const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  if (!state.logs[id]) state.logs[id] = [];
  state.logs[id].push({ time, tool, detail });
}

async function api(path, options) {
  const res = await fetch(API_BASE + path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `request failed: ${res.status}`);
  return body;
}

async function refreshSessions() {
  const before = JSON.stringify(state.sessions) + state.apiUp;
  try {
    const data = await api("/sessions");
    state.sessions = data.sessions;
    state.apiUp = true;
  } catch (e) {
    state.apiUp = false;
  }
  const after = JSON.stringify(state.sessions) + state.apiUp;
  if (before !== after) render();
}

async function checkHealth() {
  try {
    await api("/health");
    state.apiUp = true;
  } catch (e) {
    state.apiUp = false;
  }
}

async function createSession() {
  const name = prompt("Session name (its own cookies/fingerprint, isolated from other sessions):", "session-" + Math.random().toString(36).slice(2, 6));
  if (!name) return;
  const url = prompt("URL to open:", "https://example.com");
  if (!url) return;
  pushLog(name, "browser_open", `opening ${url}…`);
  state.selectedId = name;
  render();
  try {
    const res = await api(`/tools/browser_open`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ url, session: name }),
    });
    pushLog(name, "browser_open", res.text.split("\n")[0]);
  } catch (e) {
    pushLog(name, "error", e.message);
  }
  await refreshSessions();
}

async function closeSession(id) {
  try {
    await api(`/tools/close_browser`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ session: id }),
    });
  } catch (e) {
    pushLog(id, "error", e.message);
  }
  if (state.selectedId === id) state.selectedId = null;
  await refreshSessions();
}

function sendTask() {
  const el = document.getElementById("task-input");
  const text = (el ? el.value : state.taskInput).trim();
  if (!text || !state.selectedId) return;
  state.taskInput = "";
  const sessionId = state.selectedId;
  pushLog(sessionId, "task", text);
  state.activeTab = "activity";
  render();
  runTask(sessionId, text);
}

async function runTask(sessionId, task) {
  let job;
  try {
    job = await api("/tasks", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ task, session: sessionId }),
    });
  } catch (e) {
    pushLog(sessionId, "error", e.message);
    render();
    return;
  }
  state.jobs[sessionId] = { jobId: job.job_id, status: "running", human_reason: null, seenLogLength: 0 };
  render();
  pollJob(sessionId, job.job_id);
}

async function pollJob(sessionId, jobId) {
  const jobState = state.jobs[sessionId];
  if (!jobState || jobState.jobId !== jobId) return; // superseded by a newer task
  let data;
  try {
    data = await api(`/tasks/${jobId}`);
  } catch (e) {
    pushLog(sessionId, "error", e.message);
    delete state.jobs[sessionId];
    render();
    return;
  }

  for (let i = jobState.seenLogLength; i < data.log.length; i++) {
    const entry = data.log[i];
    if (entry.type === "tool_call") pushLog(sessionId, entry.name, JSON.stringify(entry.args));
    else if (entry.type === "tool_result") pushLog(sessionId, `${entry.name} ->`, entry.text.split("\n")[0]);
    else if (entry.type === "model") pushLog(sessionId, "agent", entry.text.split("\n")[0]);
  }
  jobState.seenLogLength = data.log.length;
  jobState.status = data.status;
  jobState.human_reason = data.human_reason;

  if (data.status === "running") {
    render();
    setTimeout(() => pollJob(sessionId, jobId), 1200);
  } else if (data.status === "needs_human") {
    render();
    setTimeout(() => pollJob(sessionId, jobId), 1500); // keep polling in case it's resumed elsewhere
  } else if (data.status === "done") {
    pushLog(sessionId, "done", (data.result || "").split("\n")[0] || "(no text result)");
    delete state.jobs[sessionId];
    render();
  } else {
    pushLog(sessionId, "error", data.error || "task failed");
    delete state.jobs[sessionId];
    render();
  }
}

async function resumeJob(sessionId) {
  const jobState = state.jobs[sessionId];
  if (!jobState) return;
  try {
    await api(`/tasks/${jobState.jobId}/resume`, { method: "POST" });
    pushLog(sessionId, "resumed", "human confirmed, agent continuing");
  } catch (e) {
    pushLog(sessionId, "error", e.message);
  }
  render();
  pollJob(sessionId, jobState.jobId);
}

async function loadNetwork(sessionId) {
  state.networkText = "loading…";
  render();
  try {
    const res = await api("/tools/network_requests", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ session: sessionId }),
    });
    state.networkText = res.text;
  } catch (e) {
    state.networkText = "error: " + e.message;
  }
  render();
}

async function loadState(sessionId) {
  state.stateText = "loading…";
  render();
  try {
    const res = await api("/tools/get_state", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ session: sessionId }),
    });
    state.stateText = res.text;
  } catch (e) {
    state.stateText = "error: " + e.message;
  }
  render();
}

function iconSettings() {
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
}
function iconPlus() {
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>';
}
function iconMark() {
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#050505" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 20 L10 4 L16 20 M6.5 14 L13.5 14"/><path d="M15 20 L20 4"/></svg>';
}

function render() {
  const prevInput = document.getElementById("task-input");
  const hadFocus = prevInput && document.activeElement === prevInput;
  const selectionStart = hadFocus ? prevInput.selectionStart : null;

  const active = activeDef();
  const jobState = state.selectedId ? state.jobs[state.selectedId] : null;
  const humanNeeded = jobState && jobState.status === "needs_human";
  const log = state.selectedId ? (state.logs[state.selectedId] ?? []) : [];

  const sessionsHtml = state.sessions.length ? state.sessions.map((d) => {
    const selected = d.name === state.selectedId;
    const j = state.jobs[d.name];
    const status = j && j.status === "needs_human" ? "needs you" : j && j.status === "running" ? "running" : "idle";
    const dotColor = status === "needs you" ? "var(--accent)" : status === "running" ? "#f5b24f" : "#3ddc84";
    return `
      <div class="session-card ${selected ? "selected" : ""}" data-select="${d.name}">
        <div class="session-row">
          <div class="session-name-group">
            <span class="dot" style="background:${dotColor}"></span>
            <span class="session-name">${d.name}</span>
          </div>
          <span class="session-status" style="color:${dotColor}">${status}</span>
        </div>
        <div class="session-url">${d.url || "(no page loaded)"}</div>
      </div>`;
  }).join("") : `<div class="session-empty">No sessions yet. Each session is its own isolated browser - cookies, fingerprint, everything separate.</div>`;

  const tabsHtml = ["activity", "network", "state"].map((t) => {
    const label = t[0].toUpperCase() + t.slice(1);
    return `<div class="tab ${state.activeTab === t ? "active" : ""}" data-tab="${t}">${label}</div>`;
  }).join("");

  let tabContentHtml = "";
  if (state.activeTab === "activity") {
    tabContentHtml = log.length ? `<div>${log.map((e) => `
      <div class="log-row">
        <span class="log-time">${e.time}</span>
        <span class="log-tool">${e.tool}</span>
        <span class="log-detail">${e.detail}</span>
      </div>`).join("")}</div>` : `<div class="empty-note">No activity yet on this session.</div>`;
  } else if (state.activeTab === "network") {
    tabContentHtml = `
      <button class="btn-ghost" id="load-network">Fetch real network log</button>
      <div class="state-dump" style="margin-top:14px">${state.networkText ? escapeHtml(state.networkText) : "(not loaded - click above to fetch this session's captured XHR/fetch log)"}</div>`;
  } else {
    tabContentHtml = `
      <button class="btn-ghost" id="load-state">Fetch real page state</button>
      <div class="state-dump" style="margin-top:14px">${state.stateText ? escapeHtml(state.stateText) : "(not loaded - click above to fetch this session's current interactive-element list)"}</div>`;
  }

  const approvalHtml = humanNeeded ? `
    <div class="approval-banner">
      <div>
        <div class="approval-label">Approval needed</div>
        <div class="approval-reason">${escapeHtml(jobState.human_reason || "The agent asked for a human to take over this step.")}</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-approve" id="approve-approval">I've handled it — continue</button>
      </div>
    </div>` : "";

  const mainHtml = active ? `
    <div class="session-header">
      <div><div class="title">${active.name}</div><div class="url">${active.url || "(no page loaded)"}</div></div>
      <div style="display:flex; gap:8px; align-items:center;">
        ${jobState && jobState.status === "running" ? '<div class="needs-you" style="color:#f5b24f"><span class="dot" style="background:#f5b24f"></span> Running</div>' : ""}
        ${humanNeeded ? '<div class="needs-you"><span class="dot"></span> Needs you</div>' : ""}
        <button class="btn-ghost" id="close-session">Close session</button>
      </div>
    </div>
    <div class="tabs">${tabsHtml}</div>
    <div class="tab-content">${tabContentHtml}</div>
    ${approvalHtml}
    <div class="task-row">
      <input class="task-input" id="task-input" placeholder="Tell the agent what to do…" value="${escapeAttr(state.taskInput)}" ${jobState && jobState.status === "running" ? "disabled" : ""}>
      <button class="btn-send" id="send-task" ${jobState && jobState.status === "running" ? "disabled" : ""}>Send</button>
    </div>` : `<div class="no-session-main">Select or create a session to start.</div>`;

  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="mark">${iconMark()}</div>
        <div class="wordmark"><span class="name">AX SCRAPER</span><span class="sub">by AlterX</span></div>
      </div>
      <div class="topbar-right">
        <div class="status-dot-row"><span class="status-dot ${state.apiUp ? "up" : "down"}"></span>${state.apiUp === null ? "checking…" : state.apiUp ? "backend live · localhost:8787" : "backend unreachable"}</div>
        <button class="btn-ghost">${iconSettings()} Settings</button>
      </div>
    </div>
    <div class="body">
      <div class="sidebar">
        <div class="sidebar-head"><span class="sidebar-label">Sessions</span><span class="sidebar-count">${state.sessions.length} total</span></div>
        <div class="session-list">${sessionsHtml}</div>
        <div class="new-session-wrap"><button class="btn-new" id="new-session">${iconPlus()} New session</button></div>
      </div>
      <div class="main">${mainHtml}</div>
    </div>
  `;

  document.querySelectorAll("[data-select]").forEach((el) => {
    el.addEventListener("click", () => { state.selectedId = el.dataset.select; state.networkText = null; state.stateText = null; render(); });
  });
  document.querySelectorAll("[data-tab]").forEach((el) => {
    el.addEventListener("click", () => { state.activeTab = el.dataset.tab; render(); });
  });
  const newBtn = document.getElementById("new-session");
  if (newBtn) newBtn.addEventListener("click", createSession);
  const closeBtn = document.getElementById("close-session");
  if (closeBtn) closeBtn.addEventListener("click", () => closeSession(active.name));
  const approveBtn = document.getElementById("approve-approval");
  if (approveBtn) approveBtn.addEventListener("click", () => resumeJob(state.selectedId));
  const loadNetBtn = document.getElementById("load-network");
  if (loadNetBtn) loadNetBtn.addEventListener("click", () => loadNetwork(state.selectedId));
  const loadStateBtn = document.getElementById("load-state");
  if (loadStateBtn) loadStateBtn.addEventListener("click", () => loadState(state.selectedId));
  const taskInput = document.getElementById("task-input");
  if (taskInput) {
    taskInput.addEventListener("input", (e) => { state.taskInput = e.target.value; });
    taskInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendTask(); });
    if (hadFocus) {
      taskInput.focus();
      taskInput.setSelectionRange(selectionStart, selectionStart);
    }
  }
  const sendBtn = document.getElementById("send-task");
  if (sendBtn) sendBtn.addEventListener("click", sendTask);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, "&quot;");
}

render();
checkHealth().then(refreshSessions);
setInterval(refreshSessions, 5000);
</script>
</body>
</html>
